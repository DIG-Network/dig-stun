name: Publish to crates.io

# Tag-driven release: pushing a version tag `vX.Y.Z` runs the gates, publishes to crates.io, and
# cuts a GitHub Release. A normal push to `main` runs the gates only (see ci.yml) — it does NOT
# publish. dig-stun is level 00-foundation with NO dig-*/chia-* dependencies, so there is no
# release-ordering constraint on other DIG crates FOR THIS crate — but dig-nat, dig-rpc-protocol
# and dig-node all wait on THIS publishing (dig_ecosystem#3199 S2, the release-first head).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # No fmt/clippy/test/coverage re-run here: the PR that produced this tagged commit already went
  # through ci.yml's full gate set before it was allowed to merge. This workflow is build + package +
  # publish only.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify the package builds
        run: cargo build --release --locked

      - name: Verify the package can be packaged
        run: cargo package --locked

      - name: Check CARGO_REGISTRY_TOKEN is set
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dig-stun v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-stun v${{ steps.extract_version.outputs.VERSION }}

            The DIG ecosystem's single home for reflexive-address discovery: the RFC 5389 Binding
            codec (both directions), the UDP STUN client, the single address-scope classifier
            (`Scope::{NeverDialable, PrivateScope, GlobalUnicast}`), peer observation (`observe`),
            and cross-source agreement (`establish`). See `SPEC.md` for the normative contract.

            ### Installation
            ```toml
            [dependencies]
            dig-stun = "${{ steps.extract_version.outputs.VERSION }}"
            ```
          draft: false
          prerelease: false
